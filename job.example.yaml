# A complete gpuc job spec. Submit with:
#   gpuc submit job.example.yaml --host local
#   gpuc submit job.example.yaml --runpod --gpu A40 --max-price 0.60
#
# Only `command` is required. Paths in `outputs` are relative to the workdir,
# which is an rsync of this repository's tracked *and* untracked files (git's
# .gitignore is obeyed; `--no-git` syncs a non-repo directory instead).

name: lego-s4                                   # a label, not an identifier
command: uv run --no-sync python -m experiments.lego.train --k-max 6
setup: uv sync --frozen                         # optional; runs first, phase=setup
gpus: 1                                         # 1..N of the host's owned GPUs

# Also let this job onto the host's shared cards (ones gpuc borrows while
# nobody else is on them); see docs/usage.md "Shared GPUs".
use_shared: false

env:                                            # plain environment, stored in the spec
  REQUIRE_CUDA: "1"

# Read from *your* shell at submit time and delivered to the host as
# ~/.gpuc/secrets/<job_id>.env (0600). Never in argv, never in the pod's env,
# never in a log. The runner puts them in the job's environment and in the
# environment its upload commands run with, so these are all S3 and HF need.
secrets:
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - HF_TOKEN
  - WANDB_API_KEY

# Proven writable before `main` (`failed: sync-preflight` otherwise). Files the
# checkout already had under a path are never uploaded as this job's results.
outputs:
  - path: results                               # relative to the workdir
    s3: s3://my-bucket/lego/{job_id}/results    # {job_id} is required: runs never share a prefix
  - path: checkpoints
    hf: my-org/lego-checkpoints
    hf_path: "{job_id}"                         # required in hf_path too; left out, it is the id itself
    hf_create: false                            # true: create the repo if it is missing

sync_interval_s: 180                            # background upload cadence
priority: 50                                    # 0 (first) .. 99 (last)
max_runtime_min: 600                            # null for no limit

# How long this is expected to take, from the runner's start. Nothing enforces
# it -- it is what `gpuc status` shows the next person, so they can decide
# between queueing behind this job and paying for another host.
estimated_runtime_min: 480

# Optional, and better than the guess above: run during phase `main`, its last
# stdout line is how far along the job is -- `0.42` or `42%`, never a bare
# integer. It can never fail the job. Commented out because it only works if
# the job really writes that file. See docs/usage.md "Job length estimates".
# progress_command: "tail -1 results/progress.txt"
# progress_interval_s: 60                       # minimum 5

# Let the host stop this job whenever that lets a more important queued job
# start, and queue it again to re-run from the start. For work that is cheap
# to repeat; see docs/usage.md "Automatic preemption".
auto_preempt: false

requires:
  cuda_min: "12.8"                              # informs provisioning only

# When the runner deletes workdir/ (the code *and* the venv it builds there --
# a torch venv is ~6.5 GB). Applied after the final sync, so `outputs` are
# already uploaded; spec.json, state.json and log.txt always stay.
#   on_success  remove it if the job succeeded, keep it to inspect if not
#   always      remove it whatever happened
#   never       keep it; clear it later with `gpuc clean --host H --all-finished`
cleanup: on_success
