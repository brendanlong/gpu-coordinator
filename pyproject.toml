[project]
name = "gpu-coordinator"
version = "0.1.0"
description = "GPU provisioning and per-host job queueing for local, SSH, and RunPod hosts"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "boto3>=1.35",
    "bcrypt>=5.0.0",
]

[project.scripts]
gpuc = "gpuc.control.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "pyright>=1.1.400",
    "types-pyyaml",
    "boto3-stubs[s3]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpuc"]

# The agent guide lives at skills/gpuc/SKILL.md because the docs link to it there;
# `gpuc skill` needs it inside the package for anyone who installed the wheel and
# has no checkout to read it from.
[tool.hatch.build.targets.wheel.force-include]
"skills/gpuc/SKILL.md" = "gpuc/SKILL.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["gpuc", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a local NVIDIA GPU", "runpod: creates a billable RunPod pod"]
